---
- name: Execute multiple commands on Huawei CE switches
  hosts: all
  gather_facts: no
  
  tasks:
    - name: Set screen length and get version
      ansible.netcommon.cli_command:
        command: display interface brief | include up | include GE | no-more
      register: result
    
    - name: Display results
      debug:
        var: result.stdout
